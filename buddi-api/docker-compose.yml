services:
  mysql:
    image: mysql:8.0
    container_name: buddi-mysql
    environment:
      MYSQL_ROOT_PASSWORD: buddi1234
      MYSQL_DATABASE: buddi
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - buddi-mysql-data:/var/lib/mysql

  prometheus:
    image: prom/prometheus:latest
    container_name: buddi-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    container_name: buddi-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - buddi-grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  buddi-mysql-data:
  buddi-grafana-data:
