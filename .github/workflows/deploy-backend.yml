name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'buddi-api/**'

permissions:
  id-token: write   # OIDC 토큰 발급 필요
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Build jar
        working-directory: buddi-api
        run: ./gradlew bootJar -x test

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Upload jar to S3
        working-directory: buddi-api
        run: |
          aws s3 cp build/libs/buddi-api-0.0.1-SNAPSHOT.jar \
            s3://moamong-deploy/app.jar
