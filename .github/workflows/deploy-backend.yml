name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'buddi-api/**'
      - '.github/workflows/deploy-backend.yml'

permissions:
  id-token: write   # OIDC 토큰 발급 필요
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build jar
        working-directory: buddi-api
        run: ./gradlew bootJar -x test

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Upload jar to S3
        working-directory: buddi-api
        run: |
          aws s3 cp build/libs/buddi-api-0.0.1-SNAPSHOT.jar \
            s3://moamong-deploy/app.jar

      - name: Restart service on EC2
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=moamong-api" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)
          aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["aws s3 cp s3://moamong-deploy/app.jar /app/app.jar && sed -i \"s|ExecStart=/usr/bin/java.*-jar|ExecStart=/usr/bin/java -Xmx192m -jar|\" /etc/systemd/system/buddi-api.service && systemctl daemon-reload && systemctl restart buddi-api"]'
